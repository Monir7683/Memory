<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMORY CHALLENGE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #ffffff;
  color: 222222;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 460px;
  background: #ffffff;
  border: 1px solid #dddddd;
  border-radius: 18px;
  padding: 35px 25px;
  text-align: center;
  box-shadow: 0 15px 60px #0008;
}

h1 {
  font-size: 32px;
  letter-spacing: 2px;
}

p {
  color: #b8bdd0;
  line-height: 1.6;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #222222;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #444444;
}

input {
  width: 100%;
  padding: 16px;
  border-radius: 10px;
  border: 1px solid #dddddd;
  background: #ffffff;
  color: 222222;
  font-size: 22px;
  text-align: center;
  margin-top: 15px;
}

#sequence {
  font-size: 42px;
  letter-spacing: 12px;
  font-weight: bold;
  margin: 30px 0;
}

#timer {
  color: #a995ff;
  font-size: 20px;
}

#scare {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  z-index: 10;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  padding: 20px;
}

#ghost {
  width: 100vw;
  height: 100vh;
  max-width: none;
  max-height: none;
  object-fit: cover;
}

#scare h1 {
  color: white;
  font-size: 30px;
}
</style>
</head>

<body>

<div class="card" id="welcome">
  <h1>MEMORY CHALLENGE/h1>
  <p>Think carefully. Remember the numbers.</p>
  <button onclick="startGame()">START GAME</button>
</div>

<div class="card" id="game" style="display:none">
  <h1>MEMORY CHALLENGE</h1>
  <p>Memorize this number before it disappears.</p>
  <div id="sequence">4829</div>
  <p id="timer">Remember it...</p>
  <input id="answer" type="text"
    inputmode="numeric"
    maxlength="4"
    placeholder="Enter the number">
  <button onclick="checkAnswer()">SUBMIT ANSWER</button>
  <p id="message"></p>
</div>

<div id="scare">
  <img id="ghost" src="ghost.jpg" alt="Ghost">
  <button id="again" style="display:none;max-width:300px"
    onclick="resetGame()">TRY AGAIN</button>
</div>

<audio id="scream" src="scream.mp3" preload="auto"></audio>

<script>
let countdown;
let seconds = 30;

function startGame() {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("game").style.display = "block";

  document.getElementById("sequence").textContent = "4829";
  document.getElementById("answer").value = "";
  document.getElementById("message").textContent = "";

  setTimeout(() => {
    document.getElementById("sequence").textContent = "????";
    document.getElementById("timer").textContent = "30 seconds remaining";

    seconds = 30;

    countdown = setInterval(() => {
      seconds--;
      document.getElementById("timer").textContent =
        seconds + " seconds remaining";

      if (seconds <= 0) {
        clearInterval(countdown);
        document.getElementById("message").textContent =
          "Time is up! Try again.";
      }
    }, 1000);
  }, 3000);
}

function checkAnswer() {
  const answer = document.getElementById("answer").value;

  if (answer === "4829") {
    clearInterval(countdown);
    jumpscare();
  } else {
    document.getElementById("message").textContent =
      "Not quite! Try again.";
  }
}

function jumpscare() {
  document.getElementById("game").style.display = "none";
  document.getElementById("scare").style.display = "flex";

  const audio = document.getElementById("scream");
  audio.volume = 0.8;
  audio.currentTime = 0;
  audio.play().catch(() => {});

  setTimeout(() => {
    document.getElementById("again").style.display = "block";
  }, 2500);
}

function resetGame() {
  clearInterval(countdown);
  document.getElementById("scare").style.display = "none";
  document.getElementById("again").style.display = "none";
  document.getElementById("welcome").style.display = "block";

  const audio = document.getElementById("scream");
  audio.pause();
  audio.currentTime = 0;
}
</script>

</body>
</html>

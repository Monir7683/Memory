
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Challenge</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
}

#normal {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  text-align: center;
}

.card {
  width: 100%;
  max-width: 480px;
  padding: 35px 25px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 24px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h1 {
  font-size: 32px;
}

#sequence {
  font-size: 40px;
  letter-spacing: 8px;
  margin: 25px 0;
}

button {
  padding: 14px 25px;
  border: none;
  border-radius: 12px;
  background: #ffcc00;
  color: #222;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  margin: 8px;
}

button:hover {
  transform: scale(1.04);
}

input {
  width: 100%;
  max-width: 260px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  font-size: 20px;
  text-align: center;
}

#gamePanel {
  display: none;
}

#countdown {
  font-size: 20px;
  font-weight: bold;
}

#result {
  min-height: 25px;
  font-weight: bold;
}

#scare {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  z-index: 10;
}

#ghostImage {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: ghostAppear .18s ease-out;
}

#replay {
  display: none;
  position: fixed;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  background: black;
  color: white;
  border: 1px solid white;
}

@keyframes ghostAppear {
  from {
    transform: scale(.2);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.flash {
  animation: flash .12s 3;
}

@keyframes flash {
  50% { background: white; }
}
</style>
</head>

<body>

<div id="normal">
  <div class="card">

    <div id="welcome">
      <h1>🧠 Memory Challenge</h1>
      <p>Test your memory and concentration!</p>
      <p>Remember the numbers and enter them correctly.</p>
      <button onclick="startGame()">Start Game</button>
    </div>

    <div id="gamePanel">
      <h1>Memory Test</h1>
      <p>Remember this sequence:</p>

      <h2 id="sequence">4 - 8 - 2 - 9</h2>

      <p id="countdown">Time left: 30</p>

      <input
        id="answer"
        type="text"
        inputmode="numeric"
        placeholder="Enter the numbers"
        autocomplete="off"
      >

      <br>

      <button onclick="checkAnswer()">Submit</button>

      <p id="result"></p>
    </div>

  </div>
</div>

<div id="scare">
  <img id="ghostImage" src="ghost.jpg" alt="">
</div>

<button id="replay" onclick="restart()">Try Again</button>

<script>
let triggered = false;
let timer;
let hideTimer;
let countdownTimer;
let timeLeft = 30;
let audioContext;
let screamBuffer = null;

const sequence = "4829";

async function prepareScream() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    await audioContext.resume();

    const response = await fetch("scream.mp3");
    if (!response.ok) throw new Error("Sound file not found");

    const data = await response.arrayBuffer();
    screamBuffer = await audioContext.decodeAudioData(data);

  } catch (error) {
    console.log("Audio preparation failed:", error);
  }
}

function makeScream() {
  if (audioContext && screamBuffer) {
    const source = audioContext.createBufferSource();
    const volume = audioContext.createGain();

    source.buffer = screamBuffer;
    volume.gain.value = 0.8;

    source.connect(volume);
    volume.connect(audioContext.destination);

    source.start(0);
  }
}

function startGame() {
  triggered = false;

  document.getElementById("welcome").style.display = "none";
  document.getElementById("gamePanel").style.display = "block";

  document.getElementById("sequence").textContent = "4 - 8 - 2 - 9";
  document.getElementById("answer").value = "";
  document.getElementById("result").textContent = "";

  timeLeft = 30;
  document.getElementById("countdown").textContent =
    "Time left: " + timeLeft;

  // Prepare audio after the visitor clicks Start Game
  prepareScream();

  clearTimeout(timer);
  clearTimeout(hideTimer);
  clearInterval(countdownTimer);

  hideTimer = setTimeout(() => {
    document.getElementById("sequence").textContent = "????";
  }, 3000);

  countdownTimer = setInterval(() => {
    timeLeft--;

    document.getElementById("countdown").textContent =
      "Time left: " + timeLeft;

    if (timeLeft <= 0) {
      clearInterval(countdownTimer);
      jumpscare();
    }
  }, 1000);
}

function checkAnswer() {
  if (triggered) return;

  const answer = document.getElementById("answer").value.trim();

  if (answer === sequence) {
    jumpscare();
  } else {
    document.getElementById("result").textContent =
      "Not quite! Try again.";
  }
}
function jumpscare() {
  if (triggered) return;

  triggered = true;

  clearTimeout(timer);
  clearTimeout(hideTimer);
  clearInterval(countdownTimer);

  document.getElementById("normal").style.display = "none";

  const scare = document.getElementById("scare");
  scare.style.display = "block";

  scare.classList.remove("flash");
  void scare.offsetWidth;
  scare.classList.add("flash");

  document.getElementById("replay").style.display = "none";

  makeScream();

  setTimeout(() => {
    document.getElementById("replay").style.display = "block";
  }, 2500);
}

function restart() {
  triggered = false;

  clearTimeout(timer);
  clearTimeout(hideTimer);
  clearInterval(countdownTimer);

  document.getElementById("scare").style.display = "none";
  document.getElementById("replay").style.display = "none";

  document.getElementById("normal").style.display = "flex";
  document.getElementById("welcome").style.display = "block";
  document.getElementById("gamePanel").style.display = "none";
}

document.getElementById("answer").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    checkAnswer();
  }
});
</script>

</body>
</html>
